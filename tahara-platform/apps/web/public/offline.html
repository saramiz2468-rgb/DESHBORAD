<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>אין חיבור לרשת · TAHARA</title>
    <style>
      :root {
        --bg: #f7f5f6;
        --card: #fff;
        --ink: #141216;
        --soft: #6b5462;
        --rose: #e11d63;
        --line: #eadbd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0a0c;
          --card: #261c22;
          --ink: #f5ebef;
          --soft: #cdb8c2;
          --rose: #e3a1ad;
          --line: #3d2f36;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, 'Segoe UI', Arial, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-family: Georgia, 'David', serif;
        font-weight: 500;
        font-size: 1.6rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--soft);
        line-height: 1.65;
        margin: 0 0 20px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--rose);
        color: var(--bg);
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <circle
          cx="24"
          cy="24"
          r="21"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          opacity=".5"
        />
        <path
          d="M24 9c5.8 7 9 12 9 16.2A9 9 0 0 1 15 25.2C15 21 18.2 16 24 9Z"
          fill="currentColor"
        />
      </svg>
      <h1>אין חיבור לרשת</h1>
      <p>
        כדי לשמור על הפרטיות שלך, TAHARA לא שומרת נתונים אישיים במטמון של המכשיר. כשהחיבור יחזור,
        אפשר להמשיך.
      </p>
      <a href="/today">ניסיון נוסף</a>
    </main>
  </body>
</html>
